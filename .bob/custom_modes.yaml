          ## 5. Integration Pattern Reference

          ### 5.1 Synchronous Communication

          ```
          | Pattern | Latency | Coupling | Use When | |---------|---------|---------|----------| | REST/HTTP | Low-Med | Medium | CRUD operations, public APIs, wide compatibility | | gRPC | Very Low | Medium | Internal service-to-service, high throughput, streaming | | GraphQL | Low-Med | Lower | Client-driven queries, mobile apps, BFF pattern |
          REST MATURITY LEVELS (Richardson): - Level 0: Single URI, single verb (RPC over HTTP) - Level 1: Multiple URIs, single verb (resources) - Level 2: Multiple URIs, multiple verbs (HTTP verbs as operations) - Level 3: Hypermedia (HATEOAS) — links in responses
          RECOMMENDATION: Level 2 for most APIs. Level 3 only if clients actually follow links (rare in practice).
          ```

          ### 5.2 Asynchronous Communication
          ```
          | Pattern | Delivery | Use When | |---------|----------|----------| | Message Queue (point-to-point) | Exactly-once (with idempotency) | Task distribution, work queues, command offloading | | Pub/Sub (fan-out) | At-least-once per subscriber | Event notification, multiple consumers, decoupling | | Event Streaming (log) | At-least-once, replayable | Event sourcing, audit trail, stream processing |
          TECHNOLOGIES: | Technology | Model | Strength | |-----------|-------|----------| | RabbitMQ | Queue + Pub/Sub | Flexible routing, mature, good for task queues | | Apache Kafka | Event streaming log | High throughput, replay, exactly-once semantics | | AWS SQS/SNS | Queue + Pub/Sub | Managed, serverless-friendly, simple | | Redis Streams | Lightweight streaming | Low latency, simple, good for small scale | | NATS | Lightweight Pub/Sub | Very fast, simple, cloud-native |
          CHOOSING SYNC VS ASYNC: - Need immediate response? → Synchronous - Can the caller continue without the result? → Asynchronous - Need to decouple producer and consumer lifecycles? → Asynchronous - Multiple consumers for one event? → Async Pub/Sub - Need guaranteed processing with replay? → Event Streaming - Need request-response with low latency? → Synchronous
          ```

          ### 5.3 Saga Pattern (Distributed Transactions)
          ```
          WHEN YOU NEED TRANSACTIONS ACROSS SERVICES: DO NOT use distributed 2PC (Two-Phase Commit) — it's fragile and slow. DO use the Saga pattern.
          CHOREOGRAPHY SAGA: Each service publishes events that trigger the next step. ✅ No central coordinator, loose coupling ❌ Hard to track overall progress, complex failure handling Best for: simple flows with 2-4 steps
          ORCHESTRATION SAGA: A central orchestrator directs each step. ✅ Clear flow control, easy to reason about ✅ Centralized compensation (rollback) logic ❌ Orchestrator can become a bottleneck or single point of failure Best for: complex flows with 5+ steps, clear compensation needed
          COMPENSATING TRANSACTIONS: Every step in a saga must have a compensating action: | Step | Action | Compensation | |------|--------|-------------| | 1 | Create Order | Cancel Order | | 2 | Reserve Inventory | Release Inventory | | 3 | Charge Payment | Refund Payment | | 4 | Ship Order | Cancel Shipment |
          If step 3 fails → compensate step 2 → compensate step 1.
          ```

