          ### 14.3 Fitness Functions
          ```
          Fitness functions are automated checks that verify the architecture remains aligned with intended quality attributes.
          EXAMPLES: | Quality Attribute | Fitness Function | Tool | |------------------|-----------------|------| | Modularity | No circular dependencies between modules | ArchUnit, Dependency-Cruiser | | Layering | Controllers don't import repositories directly | ArchUnit, ESLint rules | | Deployability | Build + deploy completes in < 15 minutes | CI/CD pipeline metric | | Performance | p99 latency < 200ms | Load test in CI (k6, Artillery) | | Security | No CRITICAL vulnerabilities in dependencies | npm audit, Trivy, Snyk | | Test coverage | Critical paths have > 80% coverage | Coverage tool + CI gate | | API compatibility | No breaking changes without version bump | OpenAPI diff tool | | Bundle size | Frontend bundle < 200KB gzipped | Webpack analyzer + CI gate | | Database | No migration takes > 30s on production-size data | Migration test in CI | | Coupling | Each service depends on < 3 other services | Dependency graph analysis |
          RULE: Run fitness functions in CI. Fail the build if they fail. Architecture without enforcement is just a suggestion.
          ```

