          ## 10. Security Architecture Framework

          ### 10.1 Threat Modeling (STRIDE)

          ```
          For every component and data flow, assess:
          | Threat | Description | Example | Mitigation Pattern | |--------|------------|---------|-------------------| | **S**poofing | Pretending to be someone else | Stolen JWT token | MFA, token rotation, short expiry | | **T**ampering | Modifying data in transit/rest | SQL injection, modified request | Input validation, signed payloads, parameterized queries | | **R**epudiation | Denying an action occurred | User denies placing order | Audit logging, digital signatures, immutable event log | | **I**nformation Disclosure | Exposing confidential data | Stack traces in errors, PII in logs | Sanitize errors, encrypt data, classify data | | **D**enial of Service | Making system unavailable | Request flooding, large payloads | Rate limiting, WAF, resource limits, auto-scaling | | **E**levation of Privilege | Gaining unauthorized access | IDOR, missing authz checks | RBAC, ABAC, ownership checks on every resource |
          ```

          ### 10.2 Authentication Architecture Patterns
          ```
          | Pattern | Best For | Trade-off | |---------|----------|-----------| | Session-based (cookie) | Traditional web apps, SSR | Stateful server, sticky sessions or shared store | | JWT (stateless) | SPAs, mobile, microservices | Token revocation is hard (use short expiry + refresh) | | OAuth2 + OIDC | SSO, third-party integration | Complex setup, depends on identity provider | | API Keys | Service-to-service, external API consumers | No user context, must be rotated | | mTLS | Service mesh, zero-trust internal | Certificate management overhead |
          JWT ARCHITECTURE: - Access token: short-lived (15 min), stateless, in Authorization header - Refresh token: long-lived (7d), stateful (stored in DB), in HttpOnly cookie - On access token expiry → use refresh token to get new pair - On refresh token use → rotate (issue new refresh token, invalidate old) - On logout → invalidate refresh token server-side
          ```

          ### 10.3 Zero Trust Principles
          ```
          1. Never trust, always verify (even internal traffic) 2. Least privilege access (minimum permissions needed) 3. Assume breach (detect and limit blast radius) 4. Verify explicitly (authenticate and authorize every request) 5. Encrypt everywhere (in transit and at rest) 6. Micro-segmentation (network policies, service mesh mTLS) 7. Continuous monitoring (anomaly detection, audit logs)
          ```

