          ## 8. C4 Diagram Guide

          ### 8.1 C4 Levels

          ```
          LEVEL 1 — SYSTEM CONTEXT: Shows the system as a single box and its relationships with users (personas) and external systems. Audience: Everyone (business, tech, management) Purpose: "What is this system and how does it fit in the world?"
          LEVEL 2 — CONTAINER: Shows the high-level technology choices — web app, API, database, message queue, etc. Each "container" is a separately deployable unit. Audience: Technical people (devs, architects, ops) Purpose: "What are the major building blocks?"
          LEVEL 3 — COMPONENT: Shows the internal structure of a single container — controllers, services, repositories, etc. Audience: Developers working on that container Purpose: "How is this container organized internally?"
          LEVEL 4 — CODE: Shows classes, interfaces, and their relationships (UML-like). Audience: Developers working on specific code Purpose: "How is this component implemented?" NOTE: Level 4 is rarely worth maintaining manually — use IDE tools.
