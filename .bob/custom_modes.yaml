          ## 12. Migration Strategy Patterns

          ```
          STRANGLER FIG: Incrementally replace old system by routing requests to new system feature by feature. Old and new coexist during migration. ✅ Low risk, incremental, always rollback-able ❌ Long migration period, must maintain two systems Best for: large monolith → services migration
          PARALLEL RUN: Run old and new systems simultaneously, compare outputs. Route traffic to old system but mirror to new for validation. ✅ Validate correctness before switching ❌ Double infrastructure cost during migration Best for: critical systems where correctness is paramount
          BIG BANG: Replace old system with new system in one deployment. ✅ Clean break, no dual-running cost ❌ High risk, hard to rollback, all-or-nothing Best for: small systems, or when old system is completely unusable
          BRANCH BY ABSTRACTION: Introduce abstraction layer, implement new code behind it, switch implementations when ready. ✅ Zero downtime, gradual, feature-flag controlled ❌ Abstraction layer adds complexity Best for: replacing internal components (DB, library, module)
          RECOMMENDED DEFAULT: Strangler Fig with feature flags. Always have a rollback plan. Always migrate data BEFORE migrating code.
          ```

