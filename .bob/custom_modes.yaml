          ## 4. Domain-Driven Design Reference

          ### 4.1 Strategic DDD Patterns

          ```
          BOUNDED CONTEXT: A boundary within which a domain model is consistent and a ubiquitous language applies. Different bounded contexts may use the same word with different meanings.
          Example: - "Order" in the Sales context = a customer purchase intent - "Order" in the Fulfillment context = a shipping instruction - "Order" in the Billing context = an invoice line item
          CONTEXT MAP RELATIONSHIPS: | Relationship | Description | When to Use | |-------------|-------------|-------------| | Partnership | Two teams collaborate closely | Aligned goals, willing to co-evolve | | Shared Kernel | Shared subset of the domain model | Small shared code, both teams own it | | Customer-Supplier | Upstream supplies, downstream consumes | Clear producer/consumer relationship | | Conformist | Downstream conforms to upstream model | No influence over upstream | | Anti-Corruption Layer | Translate between models | Protect your model from external mess | | Open Host Service | Public API with published language | Multiple consumers, stable interface | | Published Language | Shared interchange format | Industry standard format (e.g., HL7, FIX) | | Separate Ways | No integration | Cost of integration exceeds benefit |
          ```

          ### 4.2 Tactical DDD Patterns
          ```
          | Pattern | Purpose | Rule | |---------|---------|------| | Entity | Object with identity that persists over time | Has an ID, equality by ID not attributes | | Value Object | Immutable object defined by its attributes | No ID, equality by attribute values | | Aggregate | Cluster of entities with a root entity | All access through aggregate root, transactional boundary | | Repository | Abstraction for aggregate persistence | One repository per aggregate root | | Domain Service | Logic that doesn't belong to any entity | Stateless, operates on multiple aggregates | | Domain Event | Record of something that happened | Immutable, past tense naming (OrderPlaced, PaymentReceived) | | Factory | Complex object/aggregate creation | Encapsulate creation logic | | Specification | Reusable business rule | Composable boolean predicates |
          AGGREGATE DESIGN RULES: 1. Reference other aggregates by ID only (not direct object reference) 2. One transaction = one aggregate (consistency boundary) 3. Keep aggregates small (prefer smaller, more numerous aggregates) 4. Use eventual consistency between aggregates (domain events) 5. Design around business invariants (what MUST be consistent?)
          ```

          ### 4.3 Bounded Context to Service Mapping
          ```
          DECOMPOSITION HEURISTICS: 1. One bounded context = one service (ideal starting point) 2. Merge contexts that are always deployed together 3. Split contexts that have different scaling needs 4. Align contexts with team ownership (Conway's Law) 5. Consider data ownership — which context is the source of truth?
          WARNING SIGNS OF WRONG BOUNDARIES: - Two services that always deploy together → merge them - One service that two teams work on → split it - Circular dependencies between services → boundaries are wrong - Distributed transactions across services → boundaries are wrong - One change requires changes in 3+ services → boundaries are wrong
          ```

