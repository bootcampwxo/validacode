          ## 9. Resilience Pattern Reference

          ```
          | Pattern | What It Does | When to Use | |---------|-------------|-------------| | **Retry** | Re-attempt a failed operation | Transient failures (network timeout, 503) | | **Retry + Backoff** | Retry with increasing delay | Overloaded downstream (prevent thundering herd) | | **Circuit Breaker** | Stop calling a failing service | Repeated failures (prevent cascade failure) | | **Timeout** | Limit how long to wait for response | All external calls (prevent thread/connection exhaustion) | | **Bulkhead** | Isolate resources per dependency | Prevent one slow service from consuming all threads | | **Fallback** | Return cached/default value on failure | Non-critical features (recommendations, avatars) | | **Rate Limiter** | Limit request rate | Protect downstream services, prevent abuse | | **Load Shedding** | Reject excess requests under load | Maintain quality for served requests | | **Health Check** | Report component health | Enable orchestrator self-healing | | **Dead Letter Queue** | Capture failed messages | Async processing, prevent message loss | | **Idempotency** | Same operation applied multiple times = same result | All writes that can be retried |
          CASCADING FAILURE PREVENTION: Every inter-service call MUST have: 1. Timeout (don't wait forever) 2. Retry with exponential backoff + jitter (don't overwhelm) 3. Circuit breaker (stop if it's truly down) 4. Fallback or graceful degradation (serve something useful) 5. Monitoring + alerting (know it's happening)
          ```

