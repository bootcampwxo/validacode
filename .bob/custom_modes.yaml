          ## 6. Data Architecture Decision Framework

          ### 6.1 Storage Selection Guide

          ```
          | Need | Technology Class | Examples | |------|-----------------|---------| | Structured data, ACID transactions | Relational DB | PostgreSQL, MySQL, SQL Server | | Document-oriented, flexible schema | Document DB | MongoDB, CouchDB, Firestore | | Key-value, ultra-low latency | KV Store | Redis, DynamoDB, Memcached | | Wide column, massive scale | Column-family | Cassandra, ScyllaDB, HBase | | Graph relationships | Graph DB | Neo4j, Neptune, JanusGraph | | Full-text search | Search engine | Elasticsearch, OpenSearch, Meilisearch | | Time series data | TSDB | TimescaleDB, InfluxDB, Prometheus | | Binary/file storage | Object store | S3, MinIO, Azure Blob, GCS | | Event stream | Event log | Kafka, Pulsar, Kinesis | | Analytical queries (OLAP) | Data warehouse | BigQuery, Snowflake, Redshift, ClickHouse |
          POLYGLOT PERSISTENCE RULES: 1. Use the right storage for the access pattern (not one DB for everything) 2. Every data store must have ONE owning service (data sovereignty) 3. Synchronize between stores via events (not shared DB access) 4. Accept eventual consistency between stores 5. Start with ONE database, add others only when access patterns demand it
          ```

          ### 6.2 Caching Strategy
          ```
          CACHING LAYERS: 1. Browser cache (Cache-Control headers, ETag) 2. CDN cache (static assets, cacheable API responses) 3. API gateway cache (rate-limited responses, public data) 4. Application cache (Redis, in-memory — computed results, sessions) 5. Database cache (query cache, materialized views)
          CACHING PATTERNS: | Pattern | How | When | |---------|-----|------| | Cache-Aside | App checks cache, if miss reads DB, writes to cache | Most common, simple, flexible | | Read-Through | Cache handles DB reads transparently | When cache library supports it | | Write-Through | Write to cache and DB synchronously | Strong consistency required | | Write-Behind | Write to cache, async flush to DB | High write throughput, risk of data loss | | Refresh-Ahead | Pre-refresh cache before expiry | Predictable access patterns |
          CACHE INVALIDATION (the hard problem): - TTL-based: simple, eventual staleness (good for 90% of cases) - Event-based: invalidate on write event (strong, more complex) - Version-based: cache key includes version (ETag pattern)
          RULE: Cache reads, not writes. Cache immutable data aggressively. Cache mutable data with short TTL + event-based invalidation.
          ```

          ### 6.3 Data Consistency Patterns
          ```
          CONSISTENCY SPECTRUM: Strong ←→ Causal ←→ Session ←→ Eventual
          | Model | Guarantee | Trade-off | Use When | |-------|-----------|-----------|----------| | Strong | Read always returns latest write | Higher latency, lower availability | Financial transactions, inventory | | Causal | Reads respect cause-effect ordering | Moderate latency | Social feeds, chat messages | | Session | Reads within a session are consistent | Per-client consistency only | Shopping carts, user preferences | | Eventual | All replicas converge eventually | Lowest latency, highest availability | Analytics, notifications, logs |
          CAP THEOREM REMINDER: In a network partition, you MUST choose between: - CP: Consistency + Partition tolerance (reject requests if uncertain) - AP: Availability + Partition tolerance (serve possibly stale data)
          Most web applications choose AP with eventual consistency and compensating mechanisms for the rare partition case.
          ```

