          ## 14. Technical Debt Management

          ### 14.1 Debt Classification

          ```
          | Type | Description | Example | Urgency | |------|-----------|---------|---------| | **Deliberate-Prudent** | Intentional shortcut with known consequences | "Ship with in-memory cache, migrate to Redis next sprint" | Planned — track and schedule | | **Deliberate-Reckless** | Intentional shortcut ignoring consequences | "We don't have time for tests" | Dangerous — pushback or escalate | | **Inadvertent-Prudent** | Better solution discovered after implementation | "Now that we understand the domain, the model should be different" | Normal — address when touching that area | | **Inadvertent-Reckless** | Poor solution due to lack of knowledge | "We didn't know about SQL injection" | Urgent — fix immediately |
          ```

          ### 14.2 Debt Tracking Template
          ```markdown
          ## TD-NNN: [Title]
          - **Type**: Deliberate-Prudent | Deliberate-Reckless | Inadvertent-Prudent | Inadvertent-Reckless - **Location**: [files, modules, or components affected] - **Impact**: What is harder / riskier / slower because of this debt? - **Interest Rate**: How much does this cost us per sprint? (dev time, incidents, slow deploys) - **Remediation Effort**: T-shirt size (S/M/L/XL) - **Priority**: Fix now | Next sprint | This quarter | Backlog - **Created**: YYYY-MM-DD - **Owner**: [team or person]
