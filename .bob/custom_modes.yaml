      - relativePath: software_architecture_protocol.md
        content: |
          # Software Architecture Protocol v1.0

          ## Overview
          This protocol defines the methodology, frameworks, templates, and reference material for making, documenting, and governing software architecture decisions. Every section is designed to produce clear, justified, communicable architectural output.

          ---

          ## 1. Context Gathering Checklist

          Before proposing ANY architecture, gather this information:

          ```markdown
          ### Business Context - [ ] What business problem are we solving? - [ ] Who are the stakeholders and what are their primary concerns? - [ ] What is the business timeline and budget? - [ ] What is the expected user base (initial and 2-year projection)? - [ ] What is the revenue model (if applicable)? - [ ] What regulatory or compliance requirements exist? - [ ] What are the competitive pressures?
          ### Technical Context - [ ] What is the existing technology landscape? - [ ] What systems must we integrate with? - [ ] What technology mandates or constraints exist? - [ ] What are the existing deployment targets (cloud, on-prem, hybrid)? - [ ] What CI/CD and DevOps maturity exists? - [ ] What monitoring and observability exists?
          ### Team Context - [ ] How many developers will build and maintain this? - [ ] What are the team's technology strengths and gaps? - [ ] How is the team organized (single team, multiple teams, distributed)? - [ ] What is the team's experience with the proposed technologies? - [ ] What is the on-call and operational support model?
          ### Existing System (if brownfield) - [ ] Current architecture diagram (or verbal description) - [ ] Known pain points and technical debt - [ ] Current performance characteristics - [ ] Current deployment process and frequency - [ ] Data model and storage technologies - [ ] Integration points and contracts - [ ] Known security vulnerabilities or compliance gaps
          ```

          ---

          ## 2. Quality Attribute (NFR) Framework

          ### 2.1 Quality Attribute Scenarios
          Every quality attribute MUST be specified as a measurable scenario, not a vague statement:

          ```
          TEMPLATE: [Source] performs [Stimulus] under [Conditions], and the system responds with [Response] measured by [Metric].
          EXAMPLES:
          Performance: "A user submits a search query during peak hours (2000 concurrent users), and the system returns results within 200ms (p99)."
          Scalability: "Traffic increases 10x during a flash sale event, and the system auto-scales to maintain <500ms p99 latency without manual intervention."
          Availability: "A single availability zone fails, and the system continues serving requests with <1% error rate increase and no data loss."
          Security: "An unauthenticated user attempts to access a protected API endpoint, and the system returns 401 within 50ms and logs the attempt with source IP and timestamp."
          Maintainability: "A developer needs to add a new payment provider, and they can do so by implementing a single interface and deploying independently within 1 sprint."
          Operability: "The on-call engineer receives an alert at 3 AM, and they can diagnose root cause within 15 minutes using dashboards and runbooks without waking anyone else."
          ```

          ### 2.2 Quality Attribute Prioritization Matrix

          ```
          Rate each quality attribute for the system (H/M/L):
          | Quality Attribute | Priority | Justification | |------------------|----------|---------------| | Performance (latency) | H / M / L | | | Performance (throughput) | H / M / L | | | Scalability | H / M / L | | | Availability | H / M / L | | | Durability (data) | H / M / L | | | Security | H / M / L | | | Maintainability | H / M / L | | | Testability | H / M / L | | | Deployability | H / M / L | | | Observability | H / M / L | | | Cost efficiency | H / M / L | | | Time to market | H / M / L | | | Interoperability | H / M / L | | | Portability | H / M / L | | | Compliance | H / M / L | |
          CRITICAL INSIGHT: Quality attributes CONFLICT with each other. You CANNOT maximize all of them. Architecture is the art of making the right trade-offs.
          Common trade-offs: - Performance ↔ Maintainability (optimized code is harder to read) - Availability ↔ Consistency (CAP theorem) - Security ↔ Usability (more auth steps = more friction) - Scalability ↔ Cost (scale-ready infra costs more upfront) - Time to market ↔ Maintainability (shortcuts create debt) - Flexibility ↔ Simplicity (extension points add complexity)
          ```

          ---

          ## 3. Architectural Pattern Selection Guide

          ### 3.1 Pattern Decision Matrix

          ```
          WHEN TO USE EACH PATTERN:
          ┌─────────────────────────────────────────────────────────┐ │ MONOLITH (Modular)                                     │ │ ✅ Small team (1-8 devs)                               │ │ ✅ Single deployment unit acceptable                    │ │ ✅ Shared database is fine                              │ │ ✅ Simple operational requirements                      │ │ ✅ Time to market is critical                           │ │ ❌ Teams need independent deployment                    │ │ ❌ Parts need different scaling profiles                │ │ Trade-off: Fast start, harder to scale team later       │ └─────────────────────────────────────────────────────────┘
          ┌─────────────────────────────────────────────────────────┐ │ MODULAR MONOLITH                                       │ │ ✅ Medium team (5-20 devs)                             │ │ ✅ Want microservice-like boundaries without ops cost   │ │ ✅ Clear domain boundaries exist                        │ │ ✅ Single database is acceptable (with schema isolation)│ │ ✅ Path toward future decomposition desired             │ │ Trade-off: Best of both worlds but requires discipline  │ └─────────────────────────────────────────────────────────┘
          ┌─────────────────────────────────────────────────────────┐ │ MICROSERVICES                                           │ │ ✅ Large org with multiple teams (15+ devs)            │ │ ✅ Independent deployment is critical                   │ │ ✅ Different scaling needs per component                │ │ ✅ Different technology needs per component             │ │ ✅ Strong DevOps maturity exists                        │ │ ❌ Small team (ops overhead will consume you)           │ │ ❌ Unclear domain boundaries (you'll get them wrong)    │ │ Trade-off: Team autonomy at the cost of ops complexity  │ └─────────────────────────────────────────────────────────┘
          ┌─────────────────────────────────────────────────────────┐ │ EVENT-DRIVEN / EVENT SOURCING                           │ │ ✅ Audit trail is a requirement                         │ │ ✅ Multiple consumers need different views of same data │ │ ✅ Temporal queries matter (what was state at time T?)  │ │ ✅ High throughput, async processing                    │ │ ❌ Simple CRUD with no complex business rules           │ │ ❌ Team has no event-driven experience                  │ │ Trade-off: Powerful model, steep learning curve         │ └─────────────────────────────────────────────────────────┘
          ┌─────────────────────────────────────────────────────────┐ │ SERVERLESS                                              │ │ ✅ Highly variable / spiky traffic                      │ │ ✅ Event-driven workloads (webhooks, file processing)   │ │ ✅ Cost optimization for low/intermittent traffic       │ │ ✅ Minimal operational overhead desired                  │ │ ❌ Consistent low latency required (cold starts)        │ │ ❌ Long-running processes (>15 min)                     │ │ ❌ Complex stateful interactions                        │ │ Trade-off: Zero ops at the cost of vendor lock-in       │ └─────────────────────────────────────────────────────────┘
          ┌─────────────────────────────────────────────────────────┐ │ CQRS (Command Query Responsibility Segregation)         │ │ ✅ Read and write patterns are very different           │ │ ✅ Read-heavy workload (10:1+ read:write ratio)        │ │ ✅ Complex query requirements (search, aggregation)     │ │ ✅ Need different storage optimized for reads vs writes │ │ ❌ Simple CRUD with balanced read/write                 │ │ Trade-off: Optimized reads, eventual consistency cost   │ └─────────────────────────────────────────────────────────┘
          ```

          ### 3.2 Internal Architecture Patterns

          ```
          LAYERED ARCHITECTURE: Presentation → Application → Domain → Infrastructure ✅ Simple, well-understood, easy to enforce ❌ Tends toward anemic domain model, rigid coupling
          HEXAGONAL (Ports & Adapters): Domain Core ← Ports (interfaces) → Adapters (implementations) ✅ Domain is framework-independent, highly testable ✅ Easy to swap infrastructure (DB, queue, API) ❌ More boilerplate, harder for juniors to grasp
          CLEAN ARCHITECTURE: Entities → Use Cases → Interface Adapters → Frameworks ✅ Dependency Rule: dependencies point inward only ✅ Business logic is completely isolated ❌ Many layers, verbose for simple CRUD
          VERTICAL SLICE: Each feature is a complete slice through all layers ✅ Features are independent, easy to modify ✅ Minimal cross-feature coupling ❌ Potential for code duplication across slices ❌ Harder to enforce consistency across features
          RECOMMENDATION: - Simple CRUD app → Layered - Complex domain, long-lived system → Hexagonal or Clean - Feature-team organization → Vertical Slice - Mix as needed — not every module needs the same pattern
          ```

