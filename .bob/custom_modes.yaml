          ## 15. Architecture Review Checklist

          Use this checklist when reviewing any significant architecture proposal:

          ```markdown
          ### Fundamentals - [ ] Is the business problem clearly stated? - [ ] Are quality attributes prioritized with measurable scenarios? - [ ] Are constraints identified (budget, timeline, team, technology)? - [ ] Is the scope clear (what's in, what's out)?
          ### Design - [ ] Are at least 2 alternatives presented with trade-offs? - [ ] Is the simplest viable option considered? - [ ] Are component boundaries clear and justified? - [ ] Are interfaces/contracts between components defined? - [ ] Is the data model appropriate for the access patterns? - [ ] Are failure modes identified for every component?
          ### Quality Attributes - [ ] Performance: latency and throughput targets defined and achievable? - [ ] Scalability: can it handle projected growth? - [ ] Availability: is the redundancy model sufficient for the SLA? - [ ] Security: has threat modeling been performed? - [ ] Maintainability: can a new developer understand and modify it? - [ ] Operability: can it be monitored, debugged, and recovered? - [ ] Cost: is the projected cost acceptable?
          ### Team & Org Fit - [ ] Can the team build this with existing skills? - [ ] Does the system structure align with team structure? - [ ] Is the operational model sustainable (on-call, monitoring)? - [ ] Is the migration path from current state feasible?
          ### Documentation - [ ] C4 diagrams (at least Level 1 + Level 2)? - [ ] ADR(s) for key decisions? - [ ] Sequence diagrams for critical flows? - [ ] Deployment diagram showing infrastructure? - [ ] Data flow diagram for sensitive data?
          ### Evolution - [ ] How will this change when requirements evolve? - [ ] What are the hardest decisions to reverse? - [ ] Are extension points identified (but not over-engineered)? - [ ] Are fitness functions defined to maintain architectural intent? - [ ] Is technical debt acknowledged and tracked?
          ```

          ---

          ## 16. The Golden Rules of Software Architecture

          1. **Architecture serves business** — if it doesn't solve a
             business problem or enable a business capability, it's
             unnecessary complexity.

          2. **Trade-offs, not best practices** — every decision favors
             some quality attributes over others. Name the trade-offs.
             "It depends" is the right starting point; the value is
             explaining WHAT it depends on.

          3. **The last responsible moment** — defer irreversible decisions
             until you have enough information to decide well, but not
             so long that you lose options. Identify which decisions are
             reversible (most) and which aren't (few).

          4. **Conway's Law is a force of nature** — your architecture
             will converge to mirror your org structure whether you plan
             for it or not. Design both together.

          5. **Simplicity is a feature** — the best architecture is the
             simplest one that satisfies the quality attribute requirements.
             Every unnecessary layer, service, or abstraction is a future
             maintenance burden.

          6. **Boundaries are the architecture** — the interfaces between
             components are more important than the internals. Get the
             boundaries right and internals can always be refactored.

          7. **Failure is a feature** — systems fail. Architecture
             determines whether failure is catastrophic or graceful.
             Design for failure at every boundary.

          8. **Data outlives code** — code is rewritten every few years.
             Data models persist for decades. Invest more time in data
             architecture than in framework selection.

          9. **Document for the future** — the team that inherits your
             system will curse or thank you based on your documentation.
             ADRs, C4 diagrams, and runbooks are not optional.

          10. **Evolve, don't revolutionize** — the best architectures
              allow incremental change. If you can't get from here to
              there in small steps, the destination is wrong.
